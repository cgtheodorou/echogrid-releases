services:
  echogrid:
    image: ghcr.io/cgtheodorou/echogrid-server:latest
    container_name: echogrid-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - echogrid-data:/data
      # FCM service-account JSON (mobile push). To enable, put it on the host
      # (chmod 600) and set FCM_SA_PATH to its path; unset mounts /dev/null = off.
      - ${FCM_SA_PATH:-/dev/null}:/secrets/fcm-service-account.json:ro
      # APNs .p8 auth key (mobile push), same pattern: set APNS_P8_PATH to enable.
      # A file rather than inline PEM, since Portainer's env UI can corrupt newlines.
      - ${APNS_P8_PATH:-/dev/null}:/secrets/apns-auth-key.p8:ro
    environment:
      - EchoGrid__ServerName=Echo Grid

      # --- Auth binding (required) ---
      # The address users type into the connect form (with the port if not 443);
      # client signatures are bound to it. Never read from Host, which a relaying
      # attacker sets. Comma-separate several names, like certificate SANs.
      # Keep it equal to Caddy's ECHOGRID_DOMAIN.
      - EchoGrid__PublicAddress=${PUBLIC_ADDRESS:?set PUBLIC_ADDRESS to the host clients dial}
      # Accepts pre-2.9 unbound signatures, re-opening the relay: a migration window only.
      - EchoGrid__RequireBoundAuth=${REQUIRE_BOUND_AUTH:-true}

      # --- Klipy GIF API --- (key from https://klipy.com/developers; empty disables GIFs)
      - EchoGrid__KlipyApiKey=${KLIPY_API_KEY:-}

      # --- LiveKit sidecar (voice + screen share) ---
      # On only when PublicUrl, ApiKey and ApiSecret are all set. PublicUrl is the
      # wss:// URL clients dial; Caddy strips /livekit before :7880.
      - EchoGrid__LiveKit__PublicUrl=${LIVEKIT_PUBLIC_URL:-}
      # Must match livekit.yaml's `keys:` entry (api_key: api_secret).
      - EchoGrid__LiveKit__ApiKey=${LIVEKIT_API_KEY:-}
      - EchoGrid__LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-}

      # --- Mobile push (FCM Android + APNs iOS) ---
      # Both paths are the mounts above; a /dev/null mount logs "push disabled".
      - EchoGrid__Push__Fcm__ServiceAccountJson=/secrets/fcm-service-account.json
      - EchoGrid__Push__Apns__TeamId=${APNS_TEAM_ID:-}
      - EchoGrid__Push__Apns__KeyId=${APNS_KEY_ID:-}
      - EchoGrid__Push__Apns__P8Key=/secrets/apns-auth-key.p8
      - EchoGrid__Push__Apns__BundleId=${APNS_BUNDLE_ID:-app.echogrid}
      - EchoGrid__Push__Apns__Environment=${APNS_ENVIRONMENT:-production}

  livekit:
    image: livekit/livekit-server:latest
    container_name: echogrid-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2-alpine
    container_name: echogrid-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  echogrid-data:
  caddy-data:
  caddy-config: